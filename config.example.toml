# Eri — link router config.
#
# Place this file at one of:
#   ~/.config/eri/config.toml                 (preferred)
#   ~/Library/Application Support/Eri/config.toml
#
# `browser` is a bundle ID (com.apple.Safari, com.google.Chrome,
# org.mozilla.firefox, com.microsoft.edgemac, com.brave.Browser, ...).
# `profile` is passed as --profile-directory=<value> for Chromium browsers.
# `args` adds extra command-line arguments to the target browser.

# Fallback when no rule matches.
default = { browser = "com.apple.Safari" }

# Rules are evaluated top-to-bottom; first match wins.
# Each rule must match by exactly one of: host (glob), host_regex, url_regex.

[[rule]]
host = "github.com"
browser = "com.google.Chrome"
profile = "Default"

[[rule]]
host = "*.work.example.com"
browser = "com.google.Chrome"
profile = "Work"

[[rule]]
host_regex = "^(.+\\.)?notion\\.so$"
browser = "com.google.Chrome"
profile = "Personal"

[[rule]]
url_regex = "^https?://localhost(:\\d+)?(/.*)?$"
browser = "org.mozilla.firefox"
